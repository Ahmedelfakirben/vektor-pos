server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Security Headers & Monitoring (Trampa 2)
    add_header X-Security-Monitoring "Active (All anomalous traffic, automated scrapers and probes are logged)" always;
    add_header X-Responsible-Disclosure "mailto:security@vektorlabs.ma" always;
    add_header X-Architecture "Cryptographically Isolated Multi-Tenant Enterprise Tier" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Honeytoken / Canary Endpoint (Trampa 1)
    location ~ ^/api/internal/(debug-console|admin-env|system-status) {
        default_type application/json;
        return 200 '{\n  "status": "active_monitoring",\n  "message": "Este endpoint forma parte del sistema de deteccion de intrusiones de Vektor Labs.",\n  "notice": "Tu peticion, IP y cabeceras han sido registradas para analisis forense. Para divulgacion responsable, contacta a security@vektorlabs.ma",\n  "incident_tracking_id": "VL-SEC-CANARY-8842",\n  "responsible_disclosure": "security@vektorlabs.ma"\n}\n';
    }

    # SPA Routing (Redirect all routes to index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
