server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Security Headers & Monitoring (Trampa 2)
    add_header X-Security-Monitoring "Active (Automated analysis, scrapers and probes are logged and audited)" always;
    add_header X-Responsible-Disclosure "mailto:security@vektorlabs.ma" always;
    add_header X-Architecture "Cryptographically Isolated Multi-Tenant Enterprise Tier" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Honeytoken / Canary Endpoint (Trampa 1)
    location ~ ^/api/internal/(debug-console|admin-env|system-status) {
        default_type application/json;
        return 200 '{\n  "status": "active_monitoring",\n  "message": "Este endpoint forma parte del sistema de deteccion de intrusiones de Vektor Labs.",\n  "notice": "Tu peticion, IP y cabeceras han sido registradas para analisis forense. Para divulgacion responsable, contacta a security@vektorlabs.ma",\n  "incident_tracking_id": "VL-SEC-CANARY-8842",\n  "responsible_disclosure": "security@vektorlabs.ma"\n}\n';
    }

    # Honeytoken Interceptor (Trampa 4)
    if ($http_authorization ~* "vkt_canary_sec_89f02a7b8e1c") {
        return 403 '{\n  "status": "honeytoken_triggered",\n  "error": "SECURITY_CANARY_ALERT",\n  "message": "Honeytoken detectado. Tu peticion, IP y cabeceras han sido registradas para analisis forense.",\n  "incident_id": "VL-HONEYTOKEN-01",\n  "contact": "security@vektorlabs.ma"\n}\n';
    }
    if ($http_apikey ~* "vkt_canary_sec_89f02a7b8e1c") {
        return 403 '{\n  "status": "honeytoken_triggered",\n  "error": "SECURITY_CANARY_ALERT",\n  "message": "Honeytoken detectado. Tu peticion, IP y cabeceras han sido registradas para analisis forense.",\n  "incident_id": "VL-HONEYTOKEN-01",\n  "contact": "security@vektorlabs.ma"\n}\n';
    }
    if ($http_x_internal_staging_token ~* "vkt_canary_sec_89f02a7b8e1c") {
        return 403 '{\n  "status": "honeytoken_triggered",\n  "error": "SECURITY_CANARY_ALERT",\n  "message": "Honeytoken detectado. Tu peticion, IP y cabeceras han sido registradas para analisis forense.",\n  "incident_id": "VL-HONEYTOKEN-01",\n  "contact": "security@vektorlabs.ma"\n}\n';
    }
    if ($arg_token ~* "vkt_canary_sec_89f02a7b8e1c") {
        return 403 '{\n  "status": "honeytoken_triggered",\n  "error": "SECURITY_CANARY_ALERT",\n  "message": "Honeytoken detectado. Tu peticion, IP y cabeceras han sido registradas para analisis forense.",\n  "incident_id": "VL-HONEYTOKEN-01",\n  "contact": "security@vektorlabs.ma"\n}\n';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
